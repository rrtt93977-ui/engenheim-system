<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Engenheim System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f0d; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; direction: rtl; }
        .login-card { background-color: #121814; border: 1px solid #1f3324; padding: 35px; border-radius: 10px; width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .login-card h2 { color: #00ff66; text-align: center; margin-bottom: 25px; font-size: 20px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #a3b8ac; font-size: 13.5px; }
        .input-group input { width: 100%; padding: 12px; background-color: #0b0f0d; border: 1px solid #233b2a; border-radius: 6px; color: #ffffff; font-size: 14px; }
        .input-group input:focus { outline: none; border-color: #00ff66; }
        .btn-login { background-color: #00ff66; color: #0b0f0d; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-login:hover { background-color: #00cc52; }
        .error-msg { color: #ff4d4d; font-size: 13px; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Engenheim System</h2>
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>اسم المستخدم أو الإيميل (Username / Email):</label>
                <input type="text" id="username" required placeholder="أدخل اسم المستخدم أو الإيميل...">
            </div>
            <div class="input-group">
                <label>كلمة المرور (Password):</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور...">
            </div>
            <button type="submit" id="submitBtn" class="btn-login">تسجيل الدخول</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const btn = document.getElementById('submitBtn');
            const errDiv = document.getElementById('errorMsg');

            errDiv.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'جاري التحقق...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || 'خطأ في تسجيل الدخول');
                }

                // Save auth state
                localStorage.setItem('token', data.token);
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', data.user.role);
                localStorage.setItem('currentEmpUser', data.user.username);
                localStorage.setItem('currentEmpName', data.user.name);

                if (data.user.role === 'admin') {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'employeedash.html';
                }
            } catch (err) {
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'تسجيل الدخول';
            }
        }
    </script>
</body>
</html>
