<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Engenheim System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f0d; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; direction: rtl; }
        .login-card { background-color: #121814; border: 1px solid #1f3324; padding: 35px; border-radius: 10px; width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .login-card h2 { color: #00ff66; text-align: center; margin-bottom: 25px; font-size: 20px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #a3b8ac; font-size: 13.5px; }
        .input-group input { width: 100%; padding: 12px; background-color: #0b0f0d; border: 1px solid #233b2a; border-radius: 6px; color: #ffffff; font-size: 14px; }
        .input-group input:focus { outline: none; border-color: #00ff66; }
        .btn-login { background-color: #00ff66; color: #0b0f0d; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-login:hover { background-color: #00cc52; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Engenheim System</h2>
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>اسم المستخدم (Username):</label>
                <input type="text" id="username" required placeholder="أدخل اسم المستخدم...">
            </div>
            <div class="input-group">
                <label>كلمة المرور (Password):</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور...">
            </div>
            <button type="submit" class="btn-login">تسجيل الدخول</button>
        </form>
    </div>

    <script>
        // تهيئة حسابات الموظفين الـ 5 الافتراضية في حال لم تكن مخزنة مسبقاً
        function initDefaultEmployees() {
            if (!localStorage.getItem('ingenheim_employees')) {
                const defaultEmps = [
                    { username: 'emp1', pass: '1234', target: 20 },
                    { username: 'emp2', pass: '1234', target: 20 },
                    { username: 'emp3', pass: '1234', target: 25 },
                    { username: 'emp4', pass: '1234', target: 15 },
                    { username: 'emp5', pass: '1234', target: 30 }
                ];
                localStorage.setItem('ingenheim_employees', JSON.stringify(defaultEmps));
            }
        }

        initDefaultEmployees();

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            // 1. التحقق من حساب الأدمن الرئيسي
            if (user === 'admin' && pass === 'admin123') {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', 'admin');
                window.location.href = 'dashboard.html';
                return;
            }

            // 2. التحقق من حسابات الموظفين الـ 5 المخزنة
            let emps = JSON.parse(localStorage.getItem('ingenheim_employees')) || [];
            let matchedEmp = emps.find(e => e.username === user && e.pass === pass);

            if (matchedEmp) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', 'employee');
                localStorage.setItem('currentEmpUser', matchedEmp.username);
                window.location.href = 'employeedash.html';
                return;
            }

            alert('خطأ في اسم المستخدم أو كلمة المرور!');
        }
    </script>
</body>
</html>
