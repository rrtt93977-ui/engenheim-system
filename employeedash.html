<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الموظف | Engenheim</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="page-layout">
    <aside class="sidebar">
        <div class="sidebar-brand"><h1>Engenheim</h1><p class="subtitle">Sales Management</p></div>
        <nav class="sidebar-nav">
            <a href="employeedash.html" class="active"><i data-lucide="clipboard-list" class="nav-icon"></i>شركاتي</a>
        </nav>
        <div class="sidebar-footer">Engenheim &copy; 2026</div>
    </aside>
    <div class="main-wrapper">
        <header class="topbar">
            <h2 class="topbar-title">لوحة متابعة الموظف</h2>
            <div class="topbar-actions">
                <span class="last-updated" id="lastUpdated"></span>
                <span class="user-badge" id="empBadge"><span class="badge-dot"></span>جاري التحميل...</span>
                <button class="btn btn-logout" onclick="AUTH.logout()"><span>خروج</span></button>
            </div>
        </header>
        <main class="content-area">
            <nav class="breadcrumb"><a href="#">الرئيسية</a><span class="sep">/</span><span class="current">لوحة الموظف</span></nav>
            <div class="mb-lg anim-slide-up">
                <h2 style="font-size:var(--fs-2xl);font-weight:var(--fw-bold);color:var(--text-0)" id="greetingText">مرحباً</h2>
                <p class="text-muted mt-sm" style="font-size:var(--fs-sm)">هنا ملخص أدائك والشركات المسندة إليك</p>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-icon"><i data-lucide="briefcase"></i></div><span class="stat-label">شركاتي</span><div class="stat-value" id="myTotal">0</div></div>
                <div class="stat-card"><div class="stat-icon" style="background:var(--success-dim);color:var(--success)"><i data-lucide="trophy"></i></div><span class="stat-label">صفقات ناجحة</span><div class="stat-value" id="myDeals">0</div></div>
                <div class="stat-card"><div class="stat-icon" style="background:var(--warning-dim);color:var(--warning)"><i data-lucide="target"></i></div><span class="stat-label">نسبة الإنجاز</span><div class="stat-value" id="myProgress">0%</div></div>
                <div class="stat-card"><div class="stat-icon" style="background:var(--info-dim);color:var(--info)"><i data-lucide="phone-outgoing"></i></div><span class="stat-label">المكالمات</span><div class="stat-value" id="myCalls">0</div></div>
            </div>
            <section class="section">
                <div class="section-header"><h3 class="section-title"><i data-lucide="list"></i>الشركات الخاصة بي</h3></div>
                <table class="data-table"><thead><tr><th>الشركة</th><th>الهاتف</th><th>العنوان</th><th>المكالمات</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="myCompaniesBody"></tbody></table>
            </section>
        </main>
    </div>
</div>
<script src="app.js"></script>
<script>
if(!AUTH.requireAuth('employee')) throw new Error('Denied');
async function loadEmployeeData(){
    try{
        var meRes=await AUTH.fetchWithAuth('/api/auth/me');var me=await meRes.json();
        document.getElementById('empBadge').innerHTML='<span class="badge-dot"></span>'+me.name;
        document.getElementById('greetingText').textContent='مرحباً، '+me.name;
        var target=me.target>0?me.target:20;
        var res=await AUTH.fetchWithAuth('/api/companies?agent='+me.username);var my=await res.json();
        var dc=0,tc=0;my.forEach(function(c){if(c.status==='Deal')dc++;tc+=(c.callCount||0);});
        var pct=Math.min(Math.round((dc/target)*100),100);
        animateNumber(document.getElementById('myTotal'),my.length);
        animateNumber(document.getElementById('myDeals'),dc);
        document.getElementById('myProgress').textContent=pct+'%';
        animateNumber(document.getElementById('myCalls'),tc);
        var tb=document.getElementById('myCompaniesBody');
        if(!my.length){tb.innerHTML='<tr class="empty-row"><td colspan="6"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg><p class="empty-title">لا توجد شركات مسندة إليك حالياً</p><p class="empty-desc">سيقوم المدير بإسناد شركات جديدة لك قريباً</p></div></td></tr>';return;}
        tb.innerHTML='';my.forEach(function(c){
            var ph='<a href="tel:'+c.phone+'" style="color:var(--text-1)">'+c.phone+'</a>';
            var wa='<a href="https://wa.me/'+c.phone.replace(/[^0-9]/g,'')+'" target="_blank" class="btn btn-ghost btn-sm" title="واتساب"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></a>';
            tb.innerHTML+='<tr><td class="fw-semi">'+c.name+'</td><td>'+ph+' '+wa+'</td><td>'+c.address+'</td><td class="text-accent fw-bold">'+(c.callCount||0)+'</td><td><select class="table-select" onchange="updateStatus(\''+c._id+'\',this.value)"><option value="NoDeal"'+(c.status==='NoDeal'?' selected':'')+'>لم يتم</option><option value="Deal"'+(c.status==='Deal'?' selected':'')+'>تم الديل</option><option value="Meeting"'+(c.status==='Meeting'?' selected':'')+'>ميتينغ</option><option value="Called"'+(c.status==='Called'?' selected':'')+'>تم الاتصال</option></select></td><td><div class="flex gap-xs"><button class="btn btn-secondary btn-sm" onclick="incrementCall(\''+c._id+'\','+(c.callCount||0)+')">تسجيل مكالمة</button><button class="btn btn-primary btn-sm" onclick="makeDeal(\''+c._id+'\')">إغلاق ديل</button></div></td></tr>';
        });
        updateTimestamp('lastUpdated');if(typeof lucide!=='undefined')lucide.createIcons();
    }catch(err){console.error(err);}
}
async function incrementCall(id,count){await AUTH.fetchWithAuth('/api/companies/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({callCount:count+1})});showToast('تم تسجيل المكالمة');loadEmployeeData();}
async function makeDeal(id){await AUTH.fetchWithAuth('/api/companies/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'Deal'})});showToast('تم إغلاق الصفقة بنجاح');loadEmployeeData();}
async function updateStatus(id,s){await AUTH.fetchWithAuth('/api/companies/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});showToast('تم تحديث الحالة');loadEmployeeData();}
loadEmployeeData();
</script>
</body>
</html>
